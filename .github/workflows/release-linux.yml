name: release-linux

# Construit l'AppImage Linux (tools/make_appimage.py) sur Ubuntu 22.04, pour x86-64 et arm64 :
# Unicorn 2.1, SDL 2 et FFmpeg réduit compilés ici, autotest dans l'AppImage, puis autotest et
# innoextract dans une Debian 12 minimale, sans aucun paquet de développement. À la publication
# d'une version GitHub, les AppImage (nom versionné et nom stable) y sont jointes ; sur une PR qui
# touche à leur fabrication, elles restent des artefacts du run.
on:
  release:
    types: [published]
  # Appelé par publish.yml, qui crée la version au push d'une étiquette vX.Y.
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  pull_request:
    paths:
      - .github/workflows/release-linux.yml
      - tools/make_appimage.py
      - tools/build_ffmpeg.py
      - tools/bench_setup.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Version
        run: |
          tag="${{ inputs.tag || github.event.release.tag_name }}"
          version="${tag#v}"
          echo "VERSION=${version:-0.0}" >> "$GITHUB_ENV"
      - name: Build the AppImage
        run: python3 tools/make_appimage.py "$VERSION" --apt
      - name: Run on a bare Debian 12
        run: |
          docker run --rm -v "$PWD/build/diffusion:/a:ro" debian:12-slim sh -ec '
            cd /tmp
            /a/Zeus-Poseidon-linux-${{ matrix.arch }}.AppImage --appimage-extract > /dev/null
            squashfs-root/AppRun --selftest
            squashfs-root/usr/Helpers/innoextract --version | head -1
            ! ldd squashfs-root/usr/bin/zeus-poseidon squashfs-root/usr/lib/*.so* | grep "not found"'
      - name: Summary
        run: |
          image=build/diffusion/Zeus-Poseidon-$VERSION-linux-${{ matrix.arch }}.AppImage
          echo "::notice::$(basename $image) : $(stat -c %s $image) octets ; SHA-256 $(sha256sum $image | cut -d' ' -f1)"
      - uses: actions/upload-artifact@v4
        with:
          name: Zeus-Poseidon-${{ env.VERSION }}-linux-${{ matrix.arch }}
          path: build/diffusion/Zeus-Poseidon-${{ env.VERSION }}-linux-${{ matrix.arch }}.AppImage
      - name: Attach to the release
        if: github.event_name == 'release' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.tag || github.event.release.tag_name }}" \
            "build/diffusion/Zeus-Poseidon-$VERSION-linux-${{ matrix.arch }}.AppImage" \
            "build/diffusion/Zeus-Poseidon-linux-${{ matrix.arch }}.AppImage"
