name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux-x86-64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build pkg-config libsdl2-dev libunicorn-dev libavformat-dev libavcodec-dev libswscale-dev libswresample-dev libavutil-dev zlib1g-dev
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          cmake --build build -- -k 0
      - name: Unit tests
        run: ./build/zeus-tests
      - name: Emulator self-test
        run: ./build/zeus-run --selftest

  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Dependencies
        run: brew install cmake ninja pkgconf sdl2 unicorn ffmpeg
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          cmake --build build
      - name: Unit tests
        run: ./build/zeus-tests
      - name: Emulator self-test
        run: ./build/zeus-run --selftest
      - name: Emulator benchmark
        run: ./build/zeus-run --bench
      - name: Python tools
        run: python3 -m py_compile tools/*.py
