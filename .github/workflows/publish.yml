name: publish

# Publie une version au push d'une étiquette vX.Y : crée la version GitHub avec les notes de
# docs/releases/X.Y.md, puis fait construire et joindre les archives Mac (release.yml) et les
# AppImage Linux (release-linux.yml). Une version créée par le GITHUB_TOKEN ne déclenche pas
# l'événement « release published », d'où l'appel direct des deux workflows.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          notes="docs/releases/${tag#v}.md"
          test -f "$notes"
          gh release create "$tag" --verify-tag --title "Zeus Poseidon ${tag#v}" --notes-file "$notes"
  macos:
    needs: create
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ github.ref_name }}
  linux:
    needs: create
    uses: ./.github/workflows/release-linux.yml
    with:
      tag: ${{ github.ref_name }}
