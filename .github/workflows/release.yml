name: release

# Construit l'archive de l'application sur un Mac Apple Silicon et sur un Mac Intel de GitHub, comme
# `tools/publish.py release` sur la machine du mainteneur : FFmpeg réduit (LGPL), Python autonome,
# construction Release, paquet signé localement, autotest, recherche des mots interdits.
# À la publication d'une version GitHub, les deux archives (nom versionné et nom stable) y sont
# jointes ; sur une PR qui touche à la chaîne de publication, l'archive reste un artefact du run.
on:
  release:
    types: [published]
  # Appelé par publish.yml, qui crée la version au push d'une étiquette vX.Y.
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  pull_request:
    paths:
      - .github/workflows/release.yml
      - tools/publish.py
      - tools/make_app.py
      - tools/build_ffmpeg.py
      - tools/fetch_python.py

permissions:
  contents: write

jobs:
  macos-app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            suffix: macos-arm64
          - runner: macos-15-intel
            suffix: macos-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Dependencies
        run: brew install cmake ninja pkgconf sdl2 unicorn nasm
      - name: Version
        run: |
          tag="${{ inputs.tag || github.event.release.tag_name }}"
          version="${tag#v}"
          echo "VERSION=${version:-0.0}" >> "$GITHUB_ENV"
      - name: Reduced FFmpeg and standalone Python
        run: |
          python3 tools/build_ffmpeg.py
          python3 tools/fetch_python.py
      - name: Configure
        run: cmake -S . -B build/diffusion -G Ninja -DCMAKE_BUILD_TYPE=Release -DZEUS_FFMPEG=build/deps/ffmpeg
      - name: Package
        run: python3 tools/publish.py release "$VERSION"
      - name: Summary
        run: |
          cd build/diffusion
          minos=$(find "Zeus Poseidon.app" -type f \( -perm -u+x -o -name '*.dylib' \) -exec otool -l {} \; 2>/dev/null | awk '/minos/ {print $2}' | sort -V | tail -1)
          echo "::notice::macOS $minos minimum; $(ls -l Zeus-Poseidon-$VERSION-${{ matrix.suffix }}.zip | awk '{print $5}') octets; SHA-256 $(shasum -a 256 Zeus-Poseidon-$VERSION-${{ matrix.suffix }}.zip | cut -d' ' -f1)"
      - uses: actions/upload-artifact@v7
        with:
          name: Zeus-Poseidon-${{ env.VERSION }}-${{ matrix.suffix }}
          path: build/diffusion/Zeus-Poseidon-${{ env.VERSION }}-${{ matrix.suffix }}.zip
      - name: Attach to the release
        if: github.event_name == 'release' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.tag || github.event.release.tag_name }}" \
            "build/diffusion/Zeus-Poseidon-$VERSION-${{ matrix.suffix }}.zip" \
            build/diffusion/Zeus-Poseidon-${{ matrix.suffix }}.zip
